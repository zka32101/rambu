name: 🚀 Release Build & Deploy

on:
  push:
    tags:
      - 'v*'  # v1.0.0 などのタグでトリガー
  workflow_dispatch:  # 手動実行も可能

env:
  FLUTTER_VERSION: '3.13.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. チェックアウト
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Flutter セットアップ
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 3. 依存関係インストール
      - name: 📦 Install dependencies
        run: |
          flutter clean
          flutter pub get

      # 4. 静的解析
      - name: 🔍 Run analyzer
        run: flutter analyze

      # 5. テスト実行
      - name: 🧪 Run tests
        run: flutter test
        continue-on-error: true  # テスト失敗でも続行

      # 6. Google Play Services 設定
      - name: 🔐 Setup Google Play Services
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      # 7. キーストア設定
      - name: 🔑 Setup Keystore
        run: |
          mkdir -p ~/.android_keys
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.android_keys/rambu_shogi.keystore
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=rambu_shogi
          storeFile=$(echo ~/.android_keys/rambu_shogi.keystore | sed 's|~|/root|g')
          EOF

      # 8. AAB ビルド
      - name: 🏗️ Build AAB (Android App Bundle)
        run: flutter build appbundle --release

      # 9. APK ビルド（複数 ABI）
      - name: 🏗️ Build APK (split-per-abi)
        run: flutter build apk --release --split-per-abi

      # 10. ビルド成果物をアップロード
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      # 11. Google Play Console にアップロード
      - name: 📱 Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rambusgame.shogi
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal  # internal → alpha → beta → production
          status: draft  # draft のままアップロード（手動確認後に提出）

      # 12. Firebase Cloud Functions デプロイ
      - name: 🔥 Deploy Firebase Cloud Functions
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: rambusgame-prod
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # 13. デプロイ完了通知
      - name: ✅ Notify deployment success
        if: success()
        run: |
          cat << EOF

          🎉 ビルド＆デプロイ完了！

          ✅ AAB: build/app/outputs/bundle/release/app-release.aab
          ✅ APK: build/app/outputs/flutter-apk/app-*-release.apk
          ✅ Google Play Console: ドラフトアップロード完了
          ✅ Firebase: デプロイ完了

          📋 次のステップ:
          1. Google Play Console にログイン
          2. 「ドラフト」セクションを確認
          3. 内容確認後「リリース」をクリック

          リンク: https://play.google.com/console/developers
          EOF

      # 14. エラー通知
      - name: ❌ Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Release build failed. Check logs.'
            })

  # テスト成功時に Slack 通知（オプション）
  notify:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: success()
    steps:
      - name: 📢 Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🎉 Release Build Success!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Release Build Completed*\n✅ AAB & APK generated\n✅ Uploaded to Google Play Console (draft)\n✅ Firebase deployed\n\n🔗 <https://play.google.com/console/developers|Google Play Console>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
